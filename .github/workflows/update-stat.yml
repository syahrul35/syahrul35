
name: Update GitHub Stats

on:
  schedule:
    # Every day at 00:00 WIB (17:00 UTC)
    - cron: "0 17 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: syahrul35
        run: |
          npm run typecheck
          npm run stats:generate

      - name: Commit updated SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stats-overview.svg assets/top-languages.svg

          if git diff --cached --quiet; then
            echo "No statistics changes detected."
          else
            git commit -m "chore: update GitHub statistics"
            git push
          fi
